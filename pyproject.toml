[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-matdesign"
version = "0.2.0"
requires-python = ">=3.10"
# Dependencies are managed by the conda environment files (environment.yml /
# environment-gpu.yml). Only the package structure is declared here.

[project.scripts]
rl-matdesign = "rl_matdesign.cli:main"

[project.optional-dependencies]
# CPU development tools; scientific/runtime dependencies remain separate.
# Install with `pip install -e '.[dev]'` alongside requirements.txt and ASE.
dev = ["pytest>=7", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rl_matdesign.utils" = ["hpo_resume_compatibility.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py310"
required-version = "==0.14.3"

[tool.ruff.lint]
# Actual errors first: no formatting, import-order or broad style migration.
select = ["E9", "F63", "F7", "F82"]
