- id: decision-reward-001
  date: '2026-11-04'
  expires: '2027-05-04'
  title: Separate native-unit gate statistics from adjusted reward objectives
  choice: reward.type defaults to weighted_sum; gated compares weighted native-unit
    property scores against inclusive bounds and applies the adjusted weighted objective
    only when every gate passes. Explicit objective terms replace property weights.
    Classification selects an explicit model class index or a list of distinct indices.
    Lists sum class probabilities within each model/configuration before averaging
    surviving configurations per model and computing ensemble mean and population std.
    The existing output_index setting owns both forms; lists require aggregator index.
    At the user's request,
    dp_classification gate inputs automatically use mean minus std with coefficient one,
    independent of k or property objective, without a new configuration parameter.
    Other gate properties retain raw means; objective semantics remain unchanged.
    Raw classification mean/std remain in generated CSV and the gate column reports
    the adjusted score. predict_raw retains the same gate decision.
  alternatives_considered:
  - Product rewards, automatic delta normalization and Pareto-driven training were
    excluded by the user.
  - Computing softmax or parsing dp test output in rl-matdesign was rejected in favor
    of the DeepMD predict_proba API.
  trade_off: A failure baseline gives strict feasible dominance only below a known
    lower bound of the feasible objective. Classification requires a compatible DeepMD
    runtime and correct training class order. One checkpoint has zero ensemble std;
    1-p is not this uncertainty. generate_candidates currently records gate_passed
    and failed rewards without filtering failed gates from generated.csv; a final
    feasible-only list requires an explicit output filter. Configuration averaging
    uses surviving structures and cannot turn moderate probabilities into near-one
    values. Inspect raw CSV precision and per-configuration probabilities before
    interpreting saturation or zero ensemble std as reliable synthesis certainty.
    The automatic classification gate rule changes multi-model thresholds relative
    to older runs; a single checkpoint still has zero std and unchanged scores.
    Mean minus std is conservative for lower bounds on desired-class probabilities
    with positive weights, not universally for upper-bound or negative-weight gates.
    Ensemble disagreement is a proxy, not a calibrated confidence interval;
    all models can share an overconfident error.
    Merged-class uncertainty must be computed after summing probabilities per model;
    adding separately computed class stds loses covariance and overpenalizes models
    that agree on the accepted class union but disagree within it.
  files:
  - src/rl_matdesign/rewards.py
  - src/rl_matdesign/predictors/structure_score.py
  - src/rl_matdesign/utils/dp_eval.py
  - docs/yaml_config_reference.md
  tags:
  - reward-design
  - classification
  - configurational-averaging
- id: decision-gpu-workers-001
  date: '2026-11-03'
  expires: '2027-05-03'
  title: One persistent structure worker per GPU with automatic formula batches
  choice: Keep RL sampling and property aggregation serial; wrap arbitrary single-configuration
    builders in persistent subprocesses whose CUDA environment is set before imports.
    Discover only visible GPUs; optionally reserve logical indices. User explicitly
    removed concurrency tuning on 2026-11-03. Run exactly one task per GPU and
    default to cross-formula waves (see decision-formula-batches-001). A minimal
    structure_parallel mapping enables automatic allocation without extra parameters.
  alternatives_considered:
  - Threads or fork after CUDA initialization risk shared device state; fresh subprocesses
    isolate models and external MD children.
  - Prior one-versus-two calibration required up to five extra full MD/optimization
    runs per GPU; user preferred predictable allocation and fewer parameters.
  trade_off: One task per GPU can underutilize a small workload but avoids same-card
    structure contention and all calibration cost. Parent property models can still
    occupy GPU memory; preload them before worker allocation. Any usable configuration
    suffices, with no configurable success threshold. Legacy auto maps to one and
    old thresholds above one are ignored with deprecation warnings. No actual
    CUDA/MD benchmark was available locally.
  files:
  - src/rl_matdesign/utils/parallel_structures.py
  - src/rl_matdesign/predictors/structure_score.py
  - docs/yaml_config_reference.md
  tags:
  - parallel-configurations
  - gpu-scheduling
  - generic-builders
- id: decision-budget-001
  date: '2026-10-30'
  expires: '2027-04-30'
  title: Separate unique-candidate budget from sampled training episodes
  choice: train_count_duplicates defaults to true. When false, count canonical environment
    terminal keys once while retaining duplicate replay rows and learning updates. Share
    DQN seen keys across rewarded warmup and online training; PG scaler warmup is excluded.
    Keep DQN schedules and PG batch sizes tied to actual sampled episodes, with bounded
    consecutive duplicates and checkpointed seen keys plus separate counters.
  alternatives_considered:
  - Discard duplicate trajectories; user explicitly selected keeping them for training.
  - Infer history from the predictor cache or FIFO replay; neither guarantees complete
    candidate history, so legacy checkpoints cannot enable unique counting.
  trade_off: A fixed unique-candidate budget can take more samples, updates and wall time.
    Candidate-space exhaustion or a collapsed policy stops at the duplicate guard.
    Resume retains the saved counting mode; legacy default-mode diagnostics describe
    the resumed segment and are marked incomplete.
  files:
  - src/rl_matdesign/training.py
  - src/rl_matdesign/utils/training_budget.py
  - src/rl_matdesign/experiment.py
  tags:
  - episode-budgeting
  - composition-deduplication
  - checkpoint-compatibility
- id: decision-formula-batches-001
  date: '2026-11-03'
  expires: '2027-05-03'
  title: Bounded formula batches share one configuration worker queue by default
  choice: structure_parallel.candidate_batch_size defaults to auto and accepts auto or
    a positive integer. Capture terminal reward inputs while sampling sequentially,
    evaluate uncached unique candidates through one worker pool, then consume trajectory
    snapshots in sampling order. Keep duplicate learning and independent per-formula
    reward/failure aggregation; retain property inference in the parent process.
    Explicit batch size 1 preserves single-formula collection. User requested this
    automatic default on 2026-11-03 to avoid extra configuration parameters.
  alternatives_considered:
  - Concurrent threads mutating one environment or predictor would race policy state,
    caches, RNG and CUDA model access.
  - Requiring a fixed number of successful configs conflates candidate acceptance with
    hardware scheduling; accept any nonempty usable ensemble without a threshold.
  trade_off: DQN samples a wave with frozen policy and epsilon before sequential updates,
    so batching changes sampling trajectories. PG waves stay inside one existing
    on-policy batch. Conservative budget, duplicate, failure and checkpoint caps can
    reduce utilization, but prevent overrun or unconsumed results at checkpoint saves.
    Auto sizing is ceil(selected GPU count / configs per formula); cached formulas may leave
    some slots idle. No real GPU speedup measurement was available.
  files:
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/utils/parallel_structures.py
  - src/rl_matdesign/predictors/structure_score.py
  - src/rl_matdesign/training.py
  tags:
  - gpu-scheduling
  - batched-rewards
  - episode-budgeting
- id: decision-episode-timing-001
  date: '2026-11-03'
  expires: '2027-05-03'
  title: Keep episode wall shares separate from structure task seconds
  choice: >-
    Automatically write episode_timing.csv through PredictorTimer.record_episode.
    Measure each evaluation wave once and divide its elapsed time among attempted
    episodes; record rollout and actual RL update time separately. Capture MD and
    optimization scopes inside each worker or serial builder, preserving failed
    work, and sum task seconds per chemical formula. Cache hits and coalesced
    duplicates own no new structure or property work. DQN updates are measured per
    episode; PG updates are shared over the actual learning batch. Synchronize only
    the active CUDA training device around updates.
  alternatives_considered:
  - Adding parallel task seconds to episode wall time double counts overlapping work.
  - Timing each evaluator.next call charges an entire wave to its first returned episode.
  - Inferring MD time from total builder time minus optimization mislabels setup and I/O.
  trade_off: >-
    Parallel wall shares are accounting allocations, not each formula's latency.
    Third-party builders need optional stage hooks or aligned timing records;
    unavailable measurements and unknown serial attempt counts remain blank.
    Arbitrary stage-hook invocation counts cannot identify configuration attempts.
    External CLC deployments need the accompanying MD subprocess patch. Global
    setup, scaler fitting, checkpoint writes and post-generation diagnostics remain
    run-level overhead. Resume appends with a new timing_session identifier.
  files:
  - src/rl_matdesign/utils/stage_timing.py
  - src/rl_matdesign/utils/timing.py
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/predictors/structure_score.py
  - integrations/clc_workflow_stage_timing.patch
  tags: [performance-instrumentation, gpu-scheduling, episode-accounting]
- id: decision-training-samples-001
  date: '2026-11-10'
  expires: '2027-05-10'
  title: Persist budgeted training samples from the original evaluation snapshot
  choice: >-
    Automatically write training_samples.csv for DQN rewarded warmup/training and
    REINFORCE/A2C training. Select rows using TrainingBudget.record's budget_counted
    result, retaining charged duplicates and gate-failed successful evaluations.
    Copy material and property records during scalar/batch evaluation, before a
    later candidate can overwrite mutable caches. Read-only predictor hooks expose
    raw properties without another prediction; unsupported raw diagnostics stay
    explicitly unavailable. Flush each counted row before model updates. Save and
    restore training_sample_session_id in both trainer checkpoints so returning
    to an older checkpoint after a weights-only run selects the correct CSV lineage.
    Adapt against codex/general-refactor's scientific contracts: retain
    EpisodeSnapshot.prediction as the existing tuple and use prediction_record
    for the export dictionary. Preserve selected ScientificOutput spreads as
    None when unavailable, plus metadata from the same cached evaluation. If
    PredictorTimer implements a batch by scalar calls, capture diagnostics after
    each scalar call before a single-entry plugin cache can be overwritten.
  alternatives_considered:
  - Exporting replay rows duplicates permutation augmentation and omits PG history.
  - Re-evaluating terminal candidates adds physical cost and can change stochastic properties.
  - Selecting the latest CSV session misattributes checkpoints after weights-only restarts.
  - Resolving text conflicts alone leaves incompatible tuple/dict snapshots and old scientific cache assumptions.
  trade_off: >-
    Every row incurs a flush/fsync; schema expansion atomically rewrites the CSV.
    Rolling back a checkpoint archives the previous CSV before aligning its active
    session. Legacy or missing histories are marked incomplete instead of reconstructed.
    Generation attempts and uncharged failures remain outside this training export.
    Existing exact-resume source and protocol checks still apply; this feature
    does not allow a checkpoint created by different source code to bypass them.
  files:
  - src/rl_matdesign/utils/training_samples.py
  - src/rl_matdesign/utils/prediction_records.py
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/training.py
  - src/rl_matdesign/experiment.py
  - src/rl_matdesign/utils/timing.py
  tags: [episode-budgeting, prediction-provenance, checkpoint-compatibility]
- id: decision-hpo-v1-001
  date: '2026-11-11'
  expires: '2027-05-11'
  title: Separate HPO sampling cost, scientific scores and convergence evidence
  choice: >-
    Use the opt-in hpo_v1 YAML protocol with independent training and generation
    candidate ledgers. Count every started candidate attempt, including duplicate,
    failed and preparation-only sampling; credit only evaluated canonical unique
    candidates. Enforce A < ratio_limit * B with an exact integer maximum and
    stop only when the settled ledger cannot finish even with perfect remaining
    attempts. Score named raw properties from immutable snapshots, with direction
    and fixed threshold supplied by HPO YAML and scientific constraints inherited
    from the scene. Keep selected_budget separate from convergence_status: all
    configured budget levels and other configurations must be checked before
    claiming a plateau. Freeze selected training networks before temperature-only
    generation search. Safe resume requires matching costs, archive, RNG, predictor
    state and model/code contracts; never erase spent attempts to restart a job.
  alternatives_considered:
  - Global novelty across phases would give training-seen generation candidates free credit.
  - Prefix ratio rejection would discard runs that can still satisfy the final strict cap.
  - Reward-only or filtered-CSV scoring would change the scientific objective or denominator.
  - Calling a finite-grid winner converged would overstate evidence beyond measured budgets.
  trade_off: >-
    Full cost persistence and synchronized checkpoints add I/O. Hard interruptions
    between checkpoints can make exact continuation impossible, so diagnostics
    preserve costs and refuse rollback. Other already-integrated scenarios reuse
    the protocol through YAML; domains without exact canonical cardinality must
    explicitly use absolute_unique budgets.
  files:
  - src/rl_matdesign/hpo/controller.py
  - src/rl_matdesign/hpo/budget_search.py
  - src/rl_matdesign/hpo/scoring.py
  - src/rl_matdesign/utils/candidate_records.py
  - src/rl_matdesign/utils/generation_resume.py
  tags: [hpo, sampling-accounting, scientific-evidence]
- id: decision-hpo-v2-001
  date: '2026-11-12'
  expires: '2027-05-12'
  title: Infer scientific objectives and expose only experiment choices in HPO YAML
  choice: >-
    The simplified interface supersedes v1 templates with evaluation, training
    and generation sections. Infer a single nonzero reward objective through
    properties[].name and inherit its min/max direction and unit; keep physical
    constraints in the scene. Require evaluation.threshold and include equality.
    Fit one sigmoid scale from the first complete, archive-validated reference
    training job, freeze it for the campaign and verify its provenance on resume.
    Use one score_tolerance for total-score improvement and plateau decisions.
    training.repeats controls a fixed exploration cohort and an equally sized
    disjoint validation cohort; disagreements do not buy hidden confirmation
    seeds. generation.repeats means sampling repeats per frozen model and controls
    the full model-by-repeat product; both public phases use the name repeats.
    Default generation.repeats to 3 per the user's explicit preference; three
    trained models then produce nine runs for each generation setting/budget.
    Select the last explicitly authored generation strategy, including zero,
    and preserve it across config resolution and sorted exports. Phase budgets
    independently support fractions or absolute unique counts. Keep the budget
    multiplier/divisor fixed at 2 and both training and generation range extra
    probes fixed at 2 per direction internally. Each search round admits up to 3 distinct
    eligible finalists for validation while retaining the comparison panel;
    keep this limit internal and omit training.validation from public YAML.
    Reject these fields in simplified user YAML
    rather than silently ignoring a value that no longer controls execution.
    Legacy v1 input
    remains explicitly warned and retains its original scoring semantics.
    Expose a single top-level parallel_jobs integer, default 1, as the global
    independent-worker cap. Flatten configurations, budgets and seeds into one
    bounded queue; batch independent Optuna startup proposals while adaptive
    TPE and range/budget decisions await preceding scores. Worker processes run
    independently, but quality calibration and score finalization retain the
    original request order. Interrupted batches preserve accounting without
    choosing a replacement scientific reference; ordered resume handles scoring.
  alternatives_considered:
  - Duplicated HPO objectives and raw predictor-output names can drift from the scene reward.
  - Per-trial normalization makes scores incomparable across parameters and budgets.
  - Hidden extra seeds violate the requested single repeat-count control.
  - Three simultaneous generation controls make the active method ambiguous.
  trade_off: >-
    A single threshold cannot represent multiple competing scientific objectives;
    reject those scenes until their scoring contract is defined. A constant
    reference exactly at the threshold has no meaningful physical scale and
    stops with preserved costs instead of inventing one. Reference-derived scale
    is campaign-specific, not a claim of cross-campaign score comparability.
  files:
  - src/rl_matdesign/hpo/spec_v2.py
  - src/rl_matdesign/hpo/calibration.py
  - src/rl_matdesign/hpo/controller.py
  - src/rl_matdesign/config_schema.py
  tags: [hpo, configuration-contracts, scientific-evidence]
