  - composition-deduplication
  - checkpoint-compatibility
- id: decision-formula-batches-001
  date: '2026-11-03'
  expires: '2027-05-03'
  title: Bounded formula batches share one configuration worker queue by default
  choice: structure_parallel.candidate_batch_size defaults to auto and accepts auto or
    a positive integer. Capture terminal reward inputs while sampling sequentially,
    evaluate uncached unique candidates through one worker pool, then consume trajectory
    snapshots in sampling order. Keep duplicate learning and independent per-formula
    reward/failure aggregation; retain property inference in the parent process.
    Explicit batch size 1 preserves single-formula collection. User requested this
    automatic default on 2026-11-03 to avoid extra configuration parameters.
  alternatives_considered:
  - Concurrent threads mutating one environment or predictor would race policy state,
    caches, RNG and CUDA model access.
  - Requiring a fixed number of successful configs conflates candidate acceptance with
    hardware scheduling; accept any nonempty usable ensemble without a threshold.
  trade_off: DQN samples a wave with frozen policy and epsilon before sequential updates,
    so batching changes sampling trajectories. PG waves stay inside one existing
    on-policy batch. Conservative budget, duplicate, failure and checkpoint caps can
    reduce utilization, but prevent overrun or unconsumed results at checkpoint saves.
    Auto sizing is ceil(selected GPU count / configs per formula); cached formulas may leave
    some slots idle. No real GPU speedup measurement was available.
  files:
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/utils/parallel_structures.py
  - src/rl_matdesign/predictors/structure_score.py
  - src/rl_matdesign/training.py
  tags:
  - gpu-scheduling
  - batched-rewards
  - episode-budgeting
- id: decision-episode-timing-001
  date: '2026-11-03'
  expires: '2027-05-03'
  title: Keep episode wall shares separate from structure task seconds
  choice: >-
    Automatically write episode_timing.csv through PredictorTimer.record_episode.
    Measure each evaluation wave once and divide its elapsed time among attempted
    episodes; record rollout and actual RL update time separately. Capture MD and
    optimization scopes inside each worker or serial builder, preserving failed
    work, and sum task seconds per chemical formula. Cache hits and coalesced
    duplicates own no new structure or property work. DQN updates are measured per
    episode; PG updates are shared over the actual learning batch. Synchronize only
    the active CUDA training device around updates.
  alternatives_considered:
  - Adding parallel task seconds to episode wall time double counts overlapping work.
  - Timing each evaluator.next call charges an entire wave to its first returned episode.
  - Inferring MD time from total builder time minus optimization mislabels setup and I/O.
  trade_off: >-
    Parallel wall shares are accounting allocations, not each formula's latency.
    Third-party builders need optional stage hooks or aligned timing records;
    unavailable measurements and unknown serial attempt counts remain blank.
    Arbitrary stage-hook invocation counts cannot identify configuration attempts.
    External CLC deployments need the accompanying MD subprocess patch. Global
    setup, scaler fitting, checkpoint writes and post-generation diagnostics remain
    run-level overhead. Resume appends with a new timing_session identifier.
  files:
  - src/rl_matdesign/utils/stage_timing.py
  - src/rl_matdesign/utils/timing.py
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/predictors/structure_score.py
  - integrations/clc_workflow_stage_timing.patch
  tags: [performance-instrumentation, gpu-scheduling, episode-accounting]
- id: decision-training-samples-001
  date: '2026-11-10'
  expires: '2027-05-10'
  title: Persist budgeted training samples from the original evaluation snapshot
  choice: >-
    Automatically write training_samples.csv for DQN rewarded warmup/training and
    REINFORCE/A2C training. Select rows using TrainingBudget.record's budget_counted
    result, retaining charged duplicates and gate-failed successful evaluations.
    Copy material and property records during scalar/batch evaluation, before a
    later candidate can overwrite mutable caches. Read-only predictor hooks expose
    raw properties without another prediction; unsupported raw diagnostics stay
    explicitly unavailable. Flush each counted row before model updates. Save and
    restore training_sample_session_id in both trainer checkpoints so returning
    to an older checkpoint after a weights-only run selects the correct CSV lineage.
    Adapt against codex/general-refactor's scientific contracts: retain
    EpisodeSnapshot.prediction as the existing tuple and use prediction_record
    for the export dictionary. Preserve selected ScientificOutput spreads as
    None when unavailable, plus metadata from the same cached evaluation. If
    PredictorTimer implements a batch by scalar calls, capture diagnostics after
    each scalar call before a single-entry plugin cache can be overwritten.
  alternatives_considered:
  - Exporting replay rows duplicates permutation augmentation and omits PG history.
  - Re-evaluating terminal candidates adds physical cost and can change stochastic properties.
  - Selecting the latest CSV session misattributes checkpoints after weights-only restarts.
  - Resolving text conflicts alone leaves incompatible tuple/dict snapshots and old scientific cache assumptions.
  trade_off: >-
    Every row incurs a flush/fsync; schema expansion atomically rewrites the CSV.
    Rolling back a checkpoint archives the previous CSV before aligning its active
    session. Legacy or missing histories are marked incomplete instead of reconstructed.
    Generation attempts and uncharged failures remain outside this training export.
    Existing exact-resume source and protocol checks still apply; this feature
    does not allow a checkpoint created by different source code to bypass them.
  files:
  - src/rl_matdesign/utils/training_samples.py
  - src/rl_matdesign/utils/prediction_records.py
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/training.py
  - src/rl_matdesign/experiment.py
  - src/rl_matdesign/utils/timing.py
  tags: [episode-budgeting, prediction-provenance, checkpoint-compatibility]
- id: decision-hpo-v1-001
  date: '2026-11-11'
  expires: '2027-05-11'
  title: Separate HPO sampling cost, scientific scores and convergence evidence
  choice: >-
    Use the opt-in hpo_v1 YAML protocol with independent training and generation
    candidate ledgers. Count every started candidate attempt, including duplicate,
    failed and preparation-only sampling; credit only evaluated canonical unique
    candidates. Enforce A < ratio_limit * B with an exact integer maximum and
    stop only when the settled ledger cannot finish even with perfect remaining
    attempts. Score named raw properties from immutable snapshots, with direction
    and fixed threshold supplied by HPO YAML and scientific constraints inherited
    from the scene. Keep selected_budget separate from convergence_status: all
    configured budget levels and other configurations must be checked before
    claiming a plateau. Freeze selected training networks before temperature-only
    generation search. Safe resume requires matching costs, archive, RNG, predictor
    state and model/code contracts; never erase spent attempts to restart a job.
  alternatives_considered:
  - Global novelty across phases would give training-seen generation candidates free credit.
  - Prefix ratio rejection would discard runs that can still satisfy the final strict cap.
  - Reward-only or filtered-CSV scoring would change the scientific objective or denominator.
  - Calling a finite-grid winner converged would overstate evidence beyond measured budgets.
  trade_off: >-
    Full cost persistence and synchronized checkpoints add I/O. Hard interruptions
    between checkpoints can make exact continuation impossible, so diagnostics
    preserve costs and refuse rollback. Other already-integrated scenarios reuse
    the protocol through YAML; domains without exact canonical cardinality must
    explicitly use absolute_unique budgets.
  files:
  - src/rl_matdesign/hpo/controller.py
  - src/rl_matdesign/hpo/budget_search.py
  - src/rl_matdesign/hpo/scoring.py
  - src/rl_matdesign/utils/candidate_records.py
  - src/rl_matdesign/utils/generation_resume.py
  tags: [hpo, sampling-accounting, scientific-evidence]
- id: decision-hpo-v2-001
  date: '2026-11-12'
  expires: '2027-05-12'
  title: Infer scientific objectives and expose only experiment choices in HPO YAML
  choice: >-
    The simplified interface supersedes v1 templates with evaluation, training
    and generation sections. Infer a single nonzero reward objective through
    properties[].name and inherit its min/max direction and unit; keep physical
    constraints in the scene. Require evaluation.threshold and include equality.
    Fit one sigmoid scale from the first complete, archive-validated reference
    training job, freeze it for the campaign and verify its provenance on resume.
    Use one score_tolerance for total-score improvement and plateau decisions.
    training.repeats controls a fixed exploration cohort and an equally sized
    disjoint validation cohort; disagreements do not buy hidden confirmation
    seeds. generation.repeats means sampling repeats per frozen model and controls
    the full model-by-repeat product; both public phases use the name repeats.
    Default generation.repeats to 3 per the user's explicit preference; three
    trained models then produce nine runs for each generation setting/budget.
    Select the last explicitly authored generation strategy, including zero,
    and preserve it across config resolution and sorted exports. When migrating
    an older multi-strategy YAML, read the old runner's selection logic and write
    only the strategy it actually used. Oxide sintering with temperature 3 and
    epsilon zero sampled at temperature 3 under the original runner. Phase budgets
    independently support fractions or absolute unique counts. Keep the budget
    multiplier/divisor fixed at 2 and both training and generation range extra
    probes fixed at 2 per direction internally. Each search round admits up to 3 distinct
    eligible finalists for validation while retaining the comparison panel;
    keep this limit internal and omit training.validation from public YAML.
    Reject these fields in simplified user YAML
    rather than silently ignoring a value that no longer controls execution.
    Legacy v1 input
    remains explicitly warned and retains its original scoring semantics.
    Expose a single top-level parallel_jobs integer, default 1, as the global
    independent-worker cap. Flatten configurations, budgets and seeds into one
    bounded queue; batch independent Optuna startup proposals while adaptive
    TPE and range/budget decisions await preceding scores. Worker processes run
    independently, but quality calibration and score finalization retain the
    original request order. Interrupted batches preserve accounting without
    choosing a replacement scientific reference; ordered resume handles scoring.
  alternatives_considered:
  - Duplicated HPO objectives and raw predictor-output names can drift from the scene reward.
  - Per-trial normalization makes scores incomparable across parameters and budgets.
  - Hidden extra seeds violate the requested single repeat-count control.
  - Three simultaneous generation controls make the active method ambiguous.
  trade_off: >-
    A single threshold cannot represent multiple competing scientific objectives;
    reject those scenes until their scoring contract is defined. A constant
    reference exactly at the threshold has no meaningful physical scale and
    stops with preserved costs instead of inventing one. Reference-derived scale
    is campaign-specific, not a claim of cross-campaign score comparability.
  files:
  - src/rl_matdesign/hpo/spec_v2.py
  - src/rl_matdesign/hpo/calibration.py
  - src/rl_matdesign/hpo/controller.py
  - src/rl_matdesign/config_schema.py
  tags: [hpo, configuration-contracts, scientific-evidence]

- id: decision-hpo-storage-restart-001
  status: superseded
  superseded_by: decision-hpo-native-cooperative-stop-001
  date: '2026-11-13'
  expires: '2027-05-13'
  title: Permit reviewed HPO storage repairs without weakening scientific resume checks
  choice: >-
    Keep one latest full checkpoint per HPO training job at the existing save
    frequency. A bundled JSON registry authorizes exact old/new package and
    worker source fingerprint pairs for reviewed storage-only recovery changes.
    Compare every other campaign, model, training and generation contract field
    strictly; retain original manifests, completed artifacts and fingerprints,
    record migrations separately, and write true current provenance for new work.
    restart and resume run read-only per-job accounting/checkpoint preflight
    before launching workers; restart --check-only performs no writes or sampling.
  alternatives_considered:
  - Ignoring source fingerprints generally would silently allow scientific protocol changes.
  - Rewriting old manifests/models would destroy original execution evidence and break frozen hashes.
  - Rolling back paid ledgers to a stale checkpoint would conceal costs and inflate efficiency.
  trade_off: >-
    Missing unsaved model updates cannot be reconstructed from candidate records;
    damaged or ledger-ahead tasks remain blocked with explicit reasons. Future
    source edits must not blindly regenerate the compatibility target hashes;
    review the diff or retire the migration. The release registry test detects
    missing or stale targets, and package data must include the JSON registry.
  files: [src/rl_matdesign/hpo/restart.py, src/rl_matdesign/hpo/controller.py,
    src/rl_matdesign/hpo/cli.py, src/rl_matdesign/utils/hpo_resume_compatibility.py,
    src/rl_matdesign/utils/hpo_resume_compatibility.json]
  tags: [hpo, checkpoint-compatibility, scientific-evidence]

- id: decision-hpo-restart-runtime-concurrency-001
  date: '2026-11-13'
  expires: '2027-05-13'
  title: Separate recovery concurrency from immutable scientific plans
  choice: >-
    restart/resume --parallel-jobs changes only Campaign.parallel_jobs after
    original contract validation and before execution. Record runtime settings
    separately after successful job preflight; omit the flag to restore original
    YAML/default concurrency. Legacy plan normalization and source upgrades were
    removed at the user's request; the original campaign contract must match.
    Keep original manifests, plans, job IDs, seeds and per-job budgets unchanged.
  alternatives_considered:
  - Editing the original HPO YAML would invalidate its archived fingerprint.
  - Removing all concurrency fields from contract checks would accept authored configuration changes.
  - Ignoring extra Python files would hide potentially active custom predictor changes.
  trade_off: >-
    Source and all scientific/runtime inputs must match the original campaign.
    Parallel failure may
    leave more paid in-flight work than serial failure; retain every ledger.
  files: [src/rl_matdesign/hpo/cli.py, src/rl_matdesign/hpo/controller.py]
  tags: [hpo, recovery, concurrency, provenance]


- id: decision-hpo-single-observation-generation-repair-001
  status: superseded
  superseded_by: decision-hpo-native-cooperative-stop-001
  date: '2026-11-13'
  expires: '2027-05-13'
  title: Repair a narrowly proven generation state gap without buying an observation twice
  choice: >-
    Keep repair in standalone scripts outside the frozen source compatibility tree.
    For exactly one scalar unique successful observation beyond a verified nonempty
    generation prefix, reconstruct saved scientific caches and predictor accounting,
    restore RNG and replay the fixed policy with the recorded reward instead of an
    oracle call. Require exact runtime, assets and candidate identity before writing.
    Preserve original evidence in a fsynced transaction, recheck model/config hashes
    immediately before atomic replacement, and make interrupted apply detectable.
  alternatives_considered:
  - Resetting the ledger or discarding candidate 7 would conceal already paid cost.
  - Re-evaluating GlassNet would spend new cost and change stochastic scientific evidence.
  - Promoting the 128-byte damaged temporary file would destroy the last valid checkpoint.
  - General training recovery would require proof of missing optimizer updates and is out of scope.
  trade_off: >-
    Deliberately rejects unknown predictor/filter state, batch evaluation, duplicates,
    pending requests and larger gaps. Real GlassNet/CUDA recovery must validate in
    the original numerical environment; CPU dummy tests prove the software path only.
  files: [scripts/repair_hpo_generation.py, scripts/hpo_generation_repair_io.py,
    tests/test_hpo_generation_repair.py, tests/test_hpo_generation_repair_io.py]
  tags: [hpo, recovery, rng-replay, paid-accounting]

- id: decision-hpo-native-cooperative-stop-001
  date: '2026-11-13'
  expires: '2027-05-13'
  title: Fresh HPO campaigns use native cooperative stop and bounded checkpoints
  choice: >-
    The user explicitly abandons recovering the old disk-full campaigns and will
    recompute them. Keep native restart/resume and one atomically replaced latest
    training or generation checkpoint per job. On ordinary Ctrl+C/SIGTERM stop
    launching jobs, signal worker PIDs without killing predictor children, and
    wait for complete episode/batch/evaluation-wave checkpoints. Terminal units
    finish final exports. Repeated worker SIGTERM is idempotent; a second Ctrl+C
    can force group cleanup. No new YAML options or scientific rule changes.
    The subsequent explicit cleanup request removes old standalone repair,
    diagnosis and pruning scripts, source-upgrade registry and migration branches,
    matching tests and guides. Keep native preflight and strict scientific/runtime
    equality; do not resurrect retired helpers from historical trace entries.
  alternatives_considered:
  - Immediate termination or a fixed ten-second grace period can separate paid ledgers from unsaved model updates.
  - Extending standalone glibc or old-checkpoint migration is outside the revised user scope.
  - Silently advancing historical compatibility registry targets would grant an unaudited source migration.
  trade_off: >-
    Normal stopping may wait for initialization or the current full learning unit
    and consume its remaining budget. Forced kills, disk-full events and power
    failures still require synchronized evidence and are not guaranteed resumable.
    Fresh campaigns resume with unchanged code, configuration and assets.
    Historical repair evidence remains only in Git history and superseded records.
  files: [src/rl_matdesign/utils/hpo_stop.py, src/rl_matdesign/hpo/worker.py,
    src/rl_matdesign/training.py, src/rl_matdesign/hpo/job_runner.py,
    src/rl_matdesign/hpo/scheduling.py, src/rl_matdesign/hpo/cli.py]
  tags: [hpo, graceful-shutdown, recovery-accounting]

- id: decision-dqn-performance-upgrade-001
  date: '2026-11-15'
  expires: '2027-05-15'
  title: Permit one audited performance upgrade without restoring historical repair machinery
  choice: >-
    User explicitly requests stopping current slow DQN HPO and resuming on the faster
    implementation. Accept only the exact ba6bc1cf baseline or its evidenced six-extra-
    predictor variant, to this sealed release inventory. The six files exactly match
    deleted Git history and are not auto-imported by builtin GlassNet. Keep manifests,
    model contracts, cached job identities and paid ledgers immutable; write a separate
    upgrade receipt only on actual restart. Models/assets/runtime/configuration and
    learning contracts remain strict. Reject unknown source changes and damaged state.
    Bootstrap memoizes scalar target results using exact state/action bytes, with a
    bounded cache cleared after every target copy; forward shape and RNG remain unchanged.
  alternatives_considered:
  - A force-resume switch could admit changed scientific settings or hide spent budget.
  - Batched target forwards may alter numerical results even with mathematically equal targets.
  - Decreasing checkpoint frequency weakens the existing synchronized stopping guarantee.
  trade_off: >-
    Release source hashes must stay frozen after validation. Further source changes
    are not implicitly approved. Packed checkpoints require the new reader module.
    Target caching adds bounded RAM and benefits depend on replay reuse. CPU tests and
    local storage measurements do not establish GlassNet/CUDA/NAS wall-clock speedup.
  files: [src/rl_matdesign/utils/source_compatibility.py,
    src/rl_matdesign/utils/dqn_performance_source.json,
    src/rl_matdesign/utils/td_target_cache.py, tests/test_dqn_performance_resume.py]
  tags: [performance, scientific-contracts, hpo-restart]

- id: decision-unified-design-groups-001
  date: '2026-11-18'
  expires: '2027-05-18'
  title: Two public group domains and a singular composable structure pipeline
  choice: >-
    New configs use composition with additive amount_set, n_steps, optional total,
    unique and final element_bounds, or categorical assignments to immutable targets.
    Keep parent/novel peptide assembly in the structure adapter. Preserve original
    POSCAR header blocks before ASE normalization; alphabetical site declarations
    resolve successive blocks of each symbol without a site_map. Pipeline operations
    consume their predecessor's structure, sharing one sampled ensemble across properties.
    LiPS explicitly lists eight inline properties using two automatically reused ensembles and a best shared
    temperature reward. The user explicitly confirmed "Remove retired compatibility code":
    delete the old composition/integer/sequence readers and parameter handlers, including
    orphan utilities after migrating behavioral coverage. Descriptor contract version 4
    requires fresh training and do not broaden historical source-compatibility allowlists.
  alternatives_considered:
  - Separate fraction/integer domains and oxygen-last tokens unnecessarily constrain action order.
  - Application-specific source registries and builders repeating template loading complicate composition.
  - Residue-symbol lookup after each mutation cannot distinguish repeated original parent positions.
  trade_off: >-
    Old configs and checkpoints require migration or their archived runtime; no compatibility
    fallback remains in the public group API. Optional CLC/DeepMD backends and real
    scientific model/template assets remain required for numerical production validation.
  files: [src/rl_matdesign/amounts.py, src/rl_matdesign/categorical.py,
    src/rl_matdesign/peptide_design.py, src/rl_matdesign/predictors/builders/pipeline.py,
    docs/design_groups.md]
  tags: [design-domains, structure-pipeline, peptide-assignment]

- id: decision-inline-properties-001
  date: '2026-11-18'
  expires: '2027-05-18'
  title: One public property schema with automatic internal model reuse
  choice: >-
    All experiments declare properties entries with predictor, direction, objective,
    and optional models lists. Reject top-level predictor/model/models and property
    model/model_ref/dp_models; delete the OOH expansion shim and named-model normalizer.
    Derive private model-sharing identities from physical constructor settings; keep
    output selection and reward settings outside model load identity, and operating
    conditions in inference identity. Internal single-member leaf constructors may
    receive scalar model after the engine splits the public models list.
    Retain 25 full scenarios: one 29-species OOH DQN MC, one attached binary-gated
    perovskite, three default oxide objectives, and the other application families.
    Keep those YAML files current inside the local branch's configs directory even
    when ignored by Git. The user explicitly requires local config changes to remain
    out of remote submissions; do not stage or include scenario YAML changes in future
    commits/pushes without a later instruction overriding this restriction. Preserve
    existing ignore rules and tracked status rather than untracking files implicitly.
  alternatives_considered:
  - A public named-model registry or OOH shortcut creates multiple config paths and hidden defaults.
  - Loading a new model for every inline property duplicates expensive models and multioutput inference.
  trade_off: >-
    Inline checkpoint lists repeat across different conditions. The engine deduplicates
    identical physical definitions internally. Old configs require migration; sealed
    historical runtime artifacts and source hashes remain unchanged.
  files: [src/rl_matdesign/config_schema.py, src/rl_matdesign/registry.py,
    src/rl_matdesign/predictors/structure_score.py, src/rl_matdesign/predictors/ooh_frames.py,
    docs/configuration_schema.md]
  tags: [configuration, model-sharing, scientific-identity]

- id: decision-flat-filter-lists-001
  date: '2026-11-18'
  expires: '2027-05-18'
  title: Group filters are plain lists with implicit AND
  choice: >-
    Resolve groups[].filters directly to a list and apply all entries in declaration
    order through constraints.base.apply_filters. Remove phase_pattern and chain
    factories, classes, modules and superseded tests; current scenarios use only
    smact_charge, pauling_en and ooh_phase. Preserve strict subset validation, empty
    propagation and caller-input protection without a composite filter class.
    The list is the only enable condition across warmup, training, generation and
    baselines. No constrain_training parameter or constraints_enabled bypass exists.
  alternatives_considered:
  - Keeping a registered chain wrapper duplicates the list syntax and configuration ownership.
  - Keeping unused declarative phase patterns adds unsupported scenario surface.
  - A second phase-specific toggle contradicts the configured scientific domain; omit filters to skip them.
  trade_off: >-
    Old custom Python code must pass filters=[instances] instead of phase_filter.
    Unknown-chemistry policies and remaining scientific intervals are unchanged.
    Historical source hashes and dated validation records remain immutable evidence.
  files: [src/rl_matdesign/constraints/base.py, src/rl_matdesign/registry.py,
    src/rl_matdesign/amounts.py, src/rl_matdesign/categorical.py,
    docs/constraint_filter_contract.md]
  tags: [configuration-ownership, constraints, schema-cleanup]

- id: decision-remove-noop-execution-options-001
  date: '2026-11-18'
  expires: '2027-05-18'
  title: Remove fixed or ignored settings and scientific pipeline bypasses
  choice: >-
    Remove structure_parallel.workers_per_device, min_speedup and
    min_successful_configs: execution already uses one worker per GPU and accepts
    every nonempty successful ensemble. Remove LiPS --no-geo-opt; geometry runs
    exactly when a geo_opt operation is declared. Removed keys/flags reject rather
    than warn and ignore. Keep settings that select actual policies or physics,
    including unique, train_count_duplicates, relax_cell, energy_per_atom,
    allow_alloys, keep_scratch and HPO accounting/resume controls.
  alternatives_considered:
  - Retaining no-op knobs preserves apparent configurability while providing no behavior.
  - Removing all booleans would eliminate meaningful choices unrelated to optional block presence.
  trade_off: >-
    Old configs need obsolete keys deleted. Unrelaxed standalone LiPS evaluation
    requires a config without a geo_opt step, so scientific provenance stays explicit.
  files: [src/rl_matdesign/utils/parallel_structures.py,
    src/rl_matdesign/structure_sources.py, scripts/evaluate_lips.py]
  tags: [configuration-ownership, schema-cleanup, scientific-provenance]


- id: decision-canonical-training-parameters-001
  date: '2026-11-18'
  expires: '2027-05-18'
  title: One discount and generation quota with canonical training names
  choice: >-
    Use only gamma for DQN, REINFORCE and A2C and include it explicitly in the
    learning execution contract. Remove algorithm-specific gamma fields, all ten
    old training aliases, --dp-seed and the DQN fallback from pg_warmup_eps.
    Generate from one num_gen_eps quota; remove exploration_gen_eps and its phase
    loop. Prediction cache capacity is an internal 200000-entry LRU, and generated
    CSV automatically exports recorded scientific fields without a column mapping.
    Retired user keys reject instead of silently being translated or ignored.
  alternatives_considered:
  - Keeping aliases or fallback chains creates multiple supported configuration paths.
  - A second generation quota uses the same policy and duplicates the phase machinery.
  trade_off: >-
    Old configurations and checkpoints require the matching archived runtime or a
    fresh current configuration. Explicit duplicate-counting choices remain honored;
    omission now means unique-candidate accounting. Preserve historical source
    evidence and keep migrated scenario YAMLs local-only.
  files: [src/rl_matdesign/config_schema.py, src/rl_matdesign/experiment.py,
    src/rl_matdesign/training.py, src/rl_matdesign/utils/execution_contract.py,
    src/rl_matdesign/utils/metrics.py, src/rl_matdesign/predictors/structure_score.py]
  tags: [configuration-ownership, training, schema-cleanup]

- id: decision-step1-calibration-lifecycle-001
  date: '2026-11-24'
  expires: '2027-05-24'
  title: Freeze scientific reward calibration before updating the learner
  choice: Checkpoint each settled pilot observation without a scalar reward, freeze
    calibration by content hash, and finalize stored observations once. Bind learner
    and generation artifacts to that hash. Per the revised protocol, exclude the
    100 pilot candidates from RL budgets, replay, training seen sets and HPO scoring
    or efficiency. Report their attempts and evaluations separately, including
    interrupted jobs. DQN collects its configured warmup inside the subsequent RL
    allowance, with a minimum of one for scaler fitting; A2C retains its full policy
    training allowance. Preserve untouched HPO accounting in pilot checkpoints and
    permit resume/stop before the first training attempt. The experiment setting
    value_normalization selects the whole recipe. PopArt mode calibrates weighted-sum
    and gated rewards from exactly 100 distinct valid candidates on a fresh run.
    Raw mode skips scientific reward calibration and uses raw learner targets;
    optional gradient_clipping=clipping still collects its separate diagnostic pilot.
    Preserve raw GlassNet
    T3 in kelvin on pass and its native-unit CTE/Tg penalties on failure.
  alternatives_considered:
  - Updating scientific scales online would alter objective weights or failure severity
    and invalidate replay labels.
  - Reusing the pilot as budgeted DQN warmup imposed a 100-candidate floor and made
    small fixed budgets incomparable to A2C; the user requested a common separate pilot.
  trade_off: Pilot collection is sequential for settled resume boundaries. Scientific
    failures are valid calibration data, while unavailable predictions stay in the
    attempt ledger. Synthetic tests do not establish improved discovery.
  files:
  - src/rl_matdesign/calibration_run.py
  - src/rl_matdesign/reward_calibration.py
  - src/rl_matdesign/utils/execution_contract.py
  - src/rl_matdesign/hpo/restart.py
  - src/rl_matdesign/hpo/reporting.py
  tags:
  - calibration
  - exact-resume
  - scientific-rewards

- id: decision-gradient-clipping-001
  date: '2026-11-24'
  expires: '2027-05-24'
  title: Initialize adaptive clipping from the existing outside-budget pilot
  choice: >-
    Keep one public gradient_clipping parameter with none (default) or clipping.
    Reuse the same 100 distinct, successfully evaluated reward-pilot trajectories
    to initialize separate Q, actor and critic caps; raw-reward mode collects one
    diagnostic pilot without changing scientific rewards. Evaluate mean trajectory
    gradients on fixed disposable network copies with no optimizer steps, replay
    insertion, training sample export or RL/HPO budget charges. Set startup to the
    90th percentile of positive pilot norms. Use prior successful raw gradient norms
    from a 200-update window once it has 20 positive observations. An all-zero pilot
    waits for the first positive learning gradient to establish a provisional cap.
    Keep these constants in a versioned internal profile, not public parameters.
    Preserve live weights, PopArt buffers, gradients and RNG during probes. Save
    independent controller histories in exact-resume checkpoints and bind the full
    clipping recipe to the learning execution contract.
  alternatives_considered:
  - Fixed threshold configuration or a universal numerical Cstart was explicitly rejected by the user.
  - Training the disposable copies would measure a changing learner and violate calibration-only intent.
  - Re-evaluating the 100 candidates duplicates oracle cost; reuse verified trajectories and finalized rewards.
  trade_off: >-
    Per-candidate mean-loss gradients estimate startup scale, whereas subsequent
    updates use actual minibatch gradients. Clipping bounds the norm sent to Adam,
    not Adam parameter displacement. The pilot remains real overhead reported
    separately. Dummy validation verifies isolation and resume, not scientific
    discovery improvements or GPU performance. New actor scaling, exploration,
    reward changes and additional normalization safeguards remain outside scope.
  files:
  - src/rl_matdesign/gradient_clipping.py
  - src/rl_matdesign/gradient_calibration.py
  - src/rl_matdesign/calibration_run.py
  - src/rl_matdesign/training.py
  - src/rl_matdesign/utils/execution_contract.py
  tags: [adaptive-gradient-clipping, calibration, exact-resume, training-budgets]
