- id: pitfall-dp-output-001
  date: '2026-10-27'
  expires: '2027-01-27'
  title: Unpack DeepProperty tuple before iterating frames
  wrong: 'Converting DeepProperty.eval() directly to np.asarray adds an outer tuple
    axis: (nframes,K) becomes (1,nframes,K).'
  right: Unwrap the documented tuple first, retain legacy ndarray support, and validate
    the number of returned frames in utils/dp_eval.py. Classification should call
    DeepMD predict_proba() directly and validate its (nframes,K) probability matrix.
  impact: Only one frame was iterated and remaining entries of the preallocated ensemble
    array could remain uninitialized. Multi-configuration regression rewards could
    be incorrect.
  files:
  - src/rl_matdesign/utils/dp_eval.py
  - tests/test_dp_eval.py
  tags:
  - deepmd
  - inference-contract
  - batching
- id: pitfall-gpu-workers-001
  date: '2026-11-03'
  expires: '2027-02-03'
  title: Reject failed and unconverged configurations before property averaging
  wrong: relax_structure catches optimizer exceptions and returns a partial cell;
    a CUDA OOM can therefore appear as a successful structure. Optimizer.run(False)
    previously only warned, allowing unconverged structures into the average.
  right: Both GPU workers and serial structure scoring wrap builders and optional
    optimization in strict_relaxation_errors(), including external builders using
    the shared helper. Propagate execution errors and reject nonconvergence using
    the optimizer's full result (including cell stress), not just atomic forces.
    Inspect cached quantities for non-finite values without another DP evaluation.
    Filter per-config failures and average any survivors; reject the formula only
    when none survive. External serial builders must isolate their own per-config
    failures. Direct helper callers outside the context retain legacy handling.
    Detach calculators before IPC and kill
    complete process groups on timeout or CLI termination.
  impact: Unusable structures would corrupt delta and classification averages;
    Python-only cleanup could leave LAMMPS children on GPUs.
  files:
  - src/rl_matdesign/utils/structure.py
  - src/rl_matdesign/utils/structure_worker.py
  - src/rl_matdesign/utils/parallel_structures.py
  - src/rl_matdesign/predictors/structure_score.py
  - tests/test_relaxation_errors.py
  - tests/test_parallel_structures.py
  - tests/test_config_failure_filtering.py
  - tests/test_parallel_nonconvergence.py
  tags:
  - gpu-processes
  - error-propagation
  - convergence-validation
- id: pitfall-deepmd-runtime-001
  date: '2026-10-29'
  expires: '2027-01-29'
  title: Verify the imported DeepMD model factory before expensive classification runs
  wrong: Updating rl-matdesign or copying a new DeepMD source tree while the CLI interpreter
    still imports an older DeepMD package leaves DPA4 classification unsupported.
  right: Inspect deepmd.__file__ and deepmd.pt.model.model.__file__ using the same Python
    interpreter as rl-matdesign. The supplied DeepMD commit c856a77bfddce66afd0956c24487999a5c69c7cd
    adds classification to get_sezm_model and provides DeepClassification.predict_proba.
    Verify the selected checkpoint and head load before launching MD-backed RL. A version
    string alone may not distinguish custom source revisions.
  impact: The old factory raises 'DPA4/SeZM model supports `dpa4_ener`, `sezm_ener`, or `property`
    fitting, but got `classification`.' Candidate retries cannot fix this environment error;
    failed attempts consume wall time while the successful-episode counter remains zero.
  files:
  - src/rl_matdesign/predictors/structure_score.py
  - src/rl_matdesign/configuration.py
  - src/rl_matdesign/training.py
  tags:
  - deepmd
  - runtime-compatibility
  - model-preflight
- id: pitfall-checkpoint-prerequisites-001
  date: '2026-10-30'
  expires: '2027-01-30'
  title: Persist preprocessing before publishing intermediate training checkpoints
  wrong: DQN saved std_scaler.bin only after successful training, while intermediate
    checkpoints could already exist. A duplicate-budget guard or other training error
    could therefore leave a checkpoint that the runner could not resume.
  right: When checkpointing is enabled, persist the fitted scaler immediately after
    warmup to the output directory. Never use an explicit --load-scaler input path
    as the save destination. Preserve the budget history together with model and
    optimizer states, and verify actual CLI recovery after an interrupted run.
  impact: An otherwise usable intermediate model checkpoint could fail the runner's
    scaler prerequisite check; careless early persistence could overwrite a user input.
  files:
  - src/rl_matdesign/training.py
  - src/rl_matdesign/experiment.py
  - tests/test_duplicate_budget_cli.py
  tags:
  - checkpoints
  - preprocessing
  - input-artifact-preservation
- id: pitfall-defect-formula-001
  date: '2026-10-30'
  expires: '2027-01-30'
  title: Dopant operation counts are not a complete chemical formula
  wrong: Formatting only the resolved A/B dopant counts omits residual hosts and
    untouched template elements; three significant digits also truncate 1/32 fractions.
  right: Apply the same resolved integer substitution, removal and insertion counts
    to the template elemental counts. Normalize all species by the original A-site
    count, combine shared elements, and preserve fractional precision. Compare the
    formula with actual built atom counts, including defects and unequal site pools.
  impact: generated.csv omitted Sr, Fe and oxygen and used vacancy/interstitial
    annotations instead of chemical formulas. The optional generation charge filter
    consumes the same formula hook, so this is also a downstream validation contract.
  files:
  - src/rl_matdesign/predictors/builders/defect_site.py
  - tests/test_defect_site_formula.py
  - tests/test_parallel_structures.py
  tags:
  - composition-reporting
  - sublattice-defects
  - formula-validation
- id: pitfall-batch-proxy-001
  date: '2026-11-03'
  expires: '2027-02-03'
  title: Transparent predictor wrappers must forward optional batch capabilities
  wrong: The reward adapter recognized return_exceptions by signature, while the
    timing wrapper required a separate supports_partial_batch marker. A valid plugin
    batched directly but silently evaluated serially when wrapped by the runner.
  right: Share capability detection between the adapter and timer. Test a plugin with
    the explicit partial-batch signature and no marker, preserving output order and
    candidate-local failures. Account failed batch work in elapsed time without
    counting it as a successful reward observation.
  impact: Generic plugins could lose cross-formula concurrency only in real runs,
    despite passing direct predictor tests.
  files:
  - src/rl_matdesign/utils/episode_batch.py
  - src/rl_matdesign/utils/timing.py
  - src/rl_matdesign/configuration.py
  - tests/test_cross_formula_predictor.py
  tags:
  - wrapper-contracts
  - batched-rewards
  - performance-accounting
- id: pitfall-expensive-hpo-001
  date: '2026-11-03'
  expires: '2027-02-03'
  title: HPO stage and GPU defaults do not provide cross-trial simulation reuse
  wrong: Assuming stage2 restores full MD/configuration fidelity, resumes stage1
    training, or reuses expensive rewards across trials; assuming parallel HPO
    trials automatically receive distinct GPU groups.
  right: scripts/hpo.py shallow-merges base and fixed overrides, so replace nested
    MD mappings only in full. Stage2 retains fixed overrides and starts fresh seed
    processes; StructureScorePredictor caches are process-local. For one multi-GPU
    structure queue per trial, use n_parallel_trials 1 and inherit the GPU allocation.
    Multiple trials require explicit single-GPU IDs under the current driver;
    stage2 then also uses only one GPU. Preserve MD/optimization/reward settings
    during the initial reduced-episode screen and measure one representative trial
    before promising a wall-clock budget. No intermediate pruning is wired up.
  impact: A nominally cheap search can rerun the same expensive warmup, replace
    required MD settings, oversubscribe GPUs, or mistake low-fidelity confirmation
    for final validation. Interrupted stage1 also schedules a fresh n_trials on
    restart rather than only the remaining count.
  files:
  - scripts/hpo.py
  - src/rl_matdesign/hpo/runner.py
  - src/rl_matdesign/predictors/structure_score.py
  tags:
  - hpo-budgeting
  - gpu-allocation
  - configuration-merging
