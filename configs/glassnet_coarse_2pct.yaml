# GlassNet coarse grid (2 mol%). Select the learner with --method and --dqn-target-mode.
groups:
- name: glass
  kind: composition
  species_set:
  - SiO2
  - B2O3
  - Al2O3
  - Na2O
  - K2O
  - CaO
  - MgO
  amount_set:
    min: 0.0
    max: 1.0
    step: 0.02
  n_steps: 7
  total: 1
  element_bounds:
    SiO2:
    - 0.5
    - 0.85
    B2O3:
    - 0.05
    - 0.25
    Al2O3:
    - 0.0
    - 0.15
    Na2O:
    - 0.0
    - 0.2
    K2O:
    - 0.0
    - 0.1
    CaO:
    - 0.0
    - 0.15
    MgO:
    - 0.0
    - 0.1
properties:
- name: forming_temperature
  predictor: glassnet
  output: T3
  unit: K
  representation: physical
  direction: max
  objective: mean
- name: thermal_expansion
  predictor: glassnet
  output: CTEbelowTg
  unit: K^-1
  representation: physical
  direction: min
  objective: mean
- name: glass_transition
  predictor: glassnet
  output: Tg
  unit: K
  representation: physical
  direction: max
  objective: mean
reward:
  type: gated
  failure: {reward: -10.0}  # Raw reward when value_normalization is none
  objective:
    terms:
      forming_temperature: 1.0
  gates:
  - name: low_expansion
    score:
      terms:
        thermal_expansion: 1.0
    min: 0.0
    max: 5.0e-06
    penalty_weight: 1000000.0  # Raw CTE violation
  - name: sufficient_transition_temperature
    score:
      terms:
        glass_transition: 1.0
    min: 773.0
    penalty_weight: 0.001  # Raw Tg violation

# Coarse HPO selections (2026-11-16). Each training budget includes the pilot.
method: dqn
dqn_target_mode: bootstrap
train_budget: {dqn-bootstrap: 458, dqn-mc: 115, a2c: 916}
num_gen_eps: {dqn-bootstrap: 1, dqn-mc: 115, a2c: 229}
gen_temperature: {dqn-bootstrap: 0.0, dqn-mc: 1.0, a2c: 10.0}
value_normalization: popart
gamma: 1.0
train_count_duplicates: false
train_max_duplicate_attempts: 2000
eval_seed: 0
train_seed: 11
gen_seed: 11

# DQN shares the pilot with warmup. train_budget determines dqn_num_train_eps.
dqn_warmup_eps: 100
dqn_lr: 0.001
dqn_batch_size: 256
dqn_hidden_dim: 256
dqn_buffer_size: 50000
dqn_grad_steps_per_ep: 5
dqn_loss: smoothl1
dqn_eps_anneal_eps: 10000
dqn_eps_min: 0.05
dqn_target_update_freq: 100  # Bootstrap only
dqn_augment_permutations: 0

# A2C scaler warmup is unscored. train_budget determines pg_num_iters.
pg_warmup_eps: 200
pg_batch_eps: 15
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.01
pg_entropy_min: 0.3
pg_repeat_penalty_coef: 0.0
pg_repeat_penalty_shape: log
