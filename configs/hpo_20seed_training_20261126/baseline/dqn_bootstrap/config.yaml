groups:
- name: glass
  kind: composition
  species_set:
  - SiO2
  - B2O3
  - Al2O3
  - Na2O
  - K2O
  - CaO
  - MgO
  element_bounds:
    SiO2:
    - 0.5
    - 0.85
    B2O3:
    - 0.05
    - 0.25
    Al2O3:
    - 0.0
    - 0.15
    Na2O:
    - 0.0
    - 0.2
    K2O:
    - 0.0
    - 0.1
    CaO:
    - 0.0
    - 0.15
    MgO:
    - 0.0
    - 0.1
  amount_set:
    min: 0.0
    max: 1.0
    step: 0.02
  n_steps: 7
  total: 1
  unique: true
properties:
- name: forming_temperature
  output: T3
  unit: K
  representation: physical
  direction: min
  objective: mean
  scale: 1000
  predictor: glassnet
- name: thermal_expansion
  output: CTEbelowTg
  unit: K^-1
  representation: physical
  direction: min
  objective: mean
  predictor: glassnet
- name: glass_transition
  output: Tg
  unit: K
  representation: physical
  direction: max
  objective: mean
  predictor: glassnet
reward:
  type: gated
  objective:
    terms:
      forming_temperature: 1.0
  gates:
  - name: low_expansion
    score:
      terms:
        thermal_expansion: 1.0
    min: 0.0
    max: 4.9e-06
    penalty_weight: 1000000
  - name: sufficient_transition_temperature
    score:
      terms:
        glass_transition: 1.0
    min: 838.15
    penalty_weight: 0.001
  - name: forming_temperature_protocol_range
    score:
      terms:
        forming_temperature: 1.0
    min: 0.0
    max: 2000.0
    penalty_weight: 0.001
  failure:
    reward: -10.0
gamma: 1.0
train_count_duplicates: false
train_max_duplicate_attempts: 4580
num_gen_eps: 0
dqn_warmup_eps: 70
dqn_batch_size: 256
dqn_grad_steps_per_ep: 1
dqn_hidden_dim: 128
dqn_buffer_size: 20000
dqn_augment_permutations: 0
dqn_loss: smoothl1
dqn_lr: 0.00021609316069545398
dqn_target_update_freq: 100
train_budget: 458
method: dqn
dqn_target_mode: bootstrap
hpo_recording: true
hpo_resume_generation: false
hpo_phase: train
hpo_target_unique: 458
hpo_ratio_limit: 1.5
pg_warmup_eps: 200
pg_batch_eps: 15
pg_lr_actor: 0.001
pg_lr_critic: 0.001
k: 1.0
max_gen_attempts: 0
value_normalization: none
gradient_clipping: none
value_normalization_profile: popart_v1
exploration_adaptive: false
dqn_eps_min: 0.3391643803805721
dqn_eps_anneal_eps: 656
