# Chemical amounts and categorical assignments; see docs/design_groups.md.
groups:
- name: conditions
  kind: categorical
  n_steps: 5
  choices:
  - name: metal_amount
    values:
      min: 5
      max: 75
      step: 1
  - name: modulator
    values:
      min: 5
      max: 15
      step: 1
  - name: add_solvent
    values:
      min: 0
      max: 30
      step: 1
  - name: reaction_time
    values:
      min: 1
      max: 12
      step: 1
  - name: reaction_temperature
    values:
      min: 10
      max: 30
      step: 1
properties:
- name: q
  predictor: lookup
  models:
  - data/actmof/lookup.npz
  direction: max
  objective: mean
  scale: 100000
reward:
  type: weighted_sum
method: dqn
dqn_target_mode: mc
dqn_warmup_eps: 3
dqn_num_train_eps: 117
dqn_hidden_dim: 128
dqn_buffer_size: 10000
dqn_batch_size: 32
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 12
dqn_lr: 0.001
dqn_loss: smoothl1
dqn_augment_permutations: 0
pg_warmup_eps: 3
pg_num_iters: 39
pg_batch_eps: 3
pg_lr_actor: 0.001
pg_lr_critic: 0.001
gamma: 1.0
num_gen_eps: 200

# Shared exploration controls; controller constants are internal.
exploration_target: 0.7
gen_exploration_target: 0.7
exploration_adaptive: true
