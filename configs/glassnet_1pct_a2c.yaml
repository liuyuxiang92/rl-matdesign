# GlassNet Step 1 example. Maximize T3 subject to the CTE and Tg gates.
# Training settings are inherited from the corresponding reviewed grid and method.
groups:
- name: glass
  kind: composition
  species_set:
  - SiO2
  - B2O3
  - Al2O3
  - Na2O
  - K2O
  - CaO
  - MgO
  amount_set:
    min: 0
    max: 1
    step: 0.01
  n_steps: 7
  total: 1
  element_bounds:
    SiO2:
    - 0.5
    - 0.85
    B2O3:
    - 0.05
    - 0.25
    Al2O3:
    - 0
    - 0.15
    Na2O:
    - 0
    - 0.2
    K2O:
    - 0
    - 0.1
    CaO:
    - 0
    - 0.15
    MgO:
    - 0
    - 0.1
properties:
- name: forming_temperature
  predictor: glassnet
  output: T3
  unit: K
  representation: physical
  direction: max
  objective: mean
- name: thermal_expansion
  predictor: glassnet
  output: CTEbelowTg
  unit: K^-1
  representation: physical
  direction: min
  objective: mean
- name: glass_transition
  predictor: glassnet
  output: Tg
  unit: K
  representation: physical
  direction: max
  objective: mean
reward:
  type: gated
  failure: {reward: -10.0}  # Raw reward when value_normalization is none
  objective:
    terms:
      forming_temperature: 1.0
  gates:
  - name: low_expansion
    score:
      terms:
        thermal_expansion: 1.0
    min: 0.0
    max: 5.0e-06
    penalty_weight: 1000000.0  # Raw CTE violation
  - name: sufficient_transition_temperature
    score:
      terms:
        glass_transition: 1.0
    min: 773.0
    penalty_weight: 0.001  # Raw Tg violation
gamma: 1.0
train_count_duplicates: false
train_max_duplicate_attempts: 2000
num_gen_eps: 0
pg_warmup_eps: 100
pg_batch_eps: 8
pg_lr_actor: 0.0003574712922600243
pg_lr_critic: 0.0025369990766817706
train_budget: 20000
method: a2c
eval_seed: 0
train_seed: 11
gen_seed: 11
value_normalization: popart
