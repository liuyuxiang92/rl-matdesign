# Chemical amounts and categorical assignments; see docs/design_groups.md.
groups:
- name: alloy
  kind: composition
  species_set:
  - Co
  - Cr
  - Fe
  - Mn
  - Ni
  - Al
  - Ti
  - Cu
  - V
  - Mo
  amount_set:
    min: 0.05
    max: 0.8
    step: 0.05
  n_steps: 5
  total: 1
  unique: true
properties:
- name: quality
  predictor: dummy
  direction: max
  objective: mean
reward:
  type: weighted_sum
pg_warmup_eps: 20
pg_num_iters: 10
pg_batch_eps: 5
pg_lr_actor: 0.001
pg_lr_critic: 0.001
gamma: 0.99
num_gen_eps: 30
dqn_lr: 0.001
dqn_batch_size: 32
dqn_warmup_eps: 20
dqn_num_train_eps: 100
dqn_buffer_size: 1000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 20

# Shared exploration controls; controller constants are internal.
exploration_target: 0.7
gen_exploration_target: 0.7
exploration_adaptive: true
