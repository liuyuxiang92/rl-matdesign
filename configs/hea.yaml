# Chemical amounts and categorical assignments; see docs/design_groups.md.
groups:
- name: hea
  kind: composition
  species_set:
  - Co
  - Cr
  - Fe
  - Mn
  - Ni
  - Al
  - Ti
  - Cu
  - V
  - Mo
  - W
  - Nb
  - Ta
  - Hf
  - Zr
  amount_set:
  - 0.05
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  n_steps: 5
  total: 1
  unique: true
structure:
  builder: pipeline
  base_poscar: data/hea/FCC.POSCAR
  n_random_configs: 5
  steps:
  - type: substitute
    a_site_symbol: X
    a_dopant_group: hea
properties:
- name: energy
  predictor: dp_energy
  models:
  - models/hea/model_1.pt
  - models/hea/model_2.pt
  - models/hea/model_3.pt
  direction: min
  objective: mean_minus_kstd
  uncertainty: model_spread
reward:
  type: weighted_sum
k: 1.0
method: a2c
pg_warmup_eps: 200
pg_num_iters: 500
pg_batch_eps: 15
pg_lr_actor: 0.001
pg_lr_critic: 0.001
gamma: 0.99
num_gen_eps: 250
dqn_lr: 0.001
dqn_batch_size: 256
dqn_warmup_eps: 200
dqn_num_train_eps: 20000
dqn_buffer_size: 50000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 100
