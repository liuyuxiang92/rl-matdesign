# Copy this standalone file to hpo.yaml and fill evaluation.threshold.
# Target property/direction/unit, CTE/Tg constraints, models and design space
# are inherited from the scenario; it must declare one nonzero reward objective.
# For medium/fine, change base_config only. Defaults are unvalidated starting values.
# training.repeats controls all four training stages; validation gets fresh seeds.
# generation.repeats controls sampling repeats for each frozen model.
# The last authored gen_temperature/gen_top_frac/gen_epsilon in base_config
# chooses the generation method. Omitting initial_values uses method defaults.
base_config: /aisi/yxliu/rl-matdesign/glasspy/glassnet_benchmark_nodes_20261106/configs/coarse/dqn_bootstrap.yaml
method: dqn-bootstrap
random_seed: 42
parallel_jobs: 1  # 1 = serial; >1 caps concurrent worker jobs across all phases.
evaluation: {threshold: null, best_fraction: 0.1, score_tolerance: 0.01, max_attempts_per_unique: 1.5}
training:
  repeats: 3
  score_weights: {qualified_fraction: 0.45, best_fraction_quality: 0.3, best_value_quality: 0.1, sampling_efficiency: 0.15}
  parameter_ranges:
    dqn_lr: {type: float, low: 1.0e-05, high: 0.01, log: true}
    dqn_batch_size:
      type: categorical
      choices: [64, 128, 256, 512]
    warmup_budget_fraction: {type: float, low: 0.02, high: 0.2}
    dqn_eps_min: {type: float, low: 0.02, high: 0.4}
    epsilon_anneal_budget_ratio: {type: float, low: 0.25, high: 2.0, log: true}
    dqn_target_update_freq:
      type: categorical
      choices: [10, 25, 50, 100, 200]
  budget: {mode: fraction_of_space, min_fraction: 1.0e-06, initial_fraction: 0.0001, max_fraction: 0.01}
  search: {max_rounds: 3, trials_per_round: 30, startup_random_trials: 10}
generation:
  repeats: 3
  score_weights: {qualified_fraction: 0.5, best_fraction_quality: 0.4, best_value_quality: 0.1}
  budget: {mode: fraction_of_space, min_fraction: 1.0e-06, initial_fraction: 0.0001, max_fraction: 0.01}
