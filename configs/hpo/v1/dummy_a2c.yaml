# Software smoke test only: tiny budgets/ranges are not scientific recommendations.
# training.repeats controls all four training stages; validation gets fresh seeds.
# generation.repeats controls sampling repeats for each frozen model.
# The last authored gen_temperature/gen_top_frac/gen_epsilon in base_config
# chooses the generation method. Omitting initial_values uses method defaults.
base_config: ../scenarios/dummy.yaml
method: a2c
random_seed: 42
parallel_jobs: 1  # 1 = serial; >1 caps concurrent worker jobs across all phases.
evaluation: {threshold: 0.5, best_fraction: 0.1, score_tolerance: 0.05, max_attempts_per_unique: 1.5}
training:
  repeats: 2
  score_weights: {qualified_fraction: 0.45, best_fraction_quality: 0.3, best_value_quality: 0.1, sampling_efficiency: 0.15}
  parameter_ranges:
    pg_lr_actor:
      type: categorical
      choices: [0.0003, 0.001]
    pg_lr_critic:
      type: categorical
      choices: [0.001]
    pg_batch_eps:
      type: categorical
      choices: [4]
    pg_entropy_coef:
      type: categorical
      choices: [0.01]
    pg_entropy_min:
      type: categorical
      choices: [0.1]
  budget: {mode: absolute_unique, min_unique: 48, initial_unique: 64, max_unique: 96}
  search: {max_rounds: 2, trials_per_round: 2, startup_random_trials: 1}
generation:
  repeats: 3
  score_weights: {qualified_fraction: 0.5, best_fraction_quality: 0.4, best_value_quality: 0.1}
  budget: {mode: absolute_unique, min_unique: 8, initial_unique: 16, max_unique: 32}
  initial_values: [0, 1, 100]
