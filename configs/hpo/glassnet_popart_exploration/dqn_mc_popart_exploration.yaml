# GlassNet coarse: Step 1 PopArt + Step 2 adaptive clipping + Step 3 exploration.
# Scientific conditions are preserved; paired HPO overrides the searchable learner settings.
# Standalone train_budget remains 10000; the paired HPO YAML overrides it.
# num_gen_eps: 0 is training-only; HPO searches generation at its separate budget.
# The shared 100-candidate calibration pilot is outside the RL/HPO budget.
groups:
- name: glass
  kind: composition
  species_set:
  - SiO2
  - B2O3
  - Al2O3
  - Na2O
  - K2O
  - CaO
  - MgO
  amount_set:
    min: 0.0
    max: 1.0
    step: 0.02
  n_steps: 7
  total: 1
  unique: true
  element_bounds:
    SiO2:
    - 0.5
    - 0.85
    B2O3:
    - 0.05
    - 0.25
    Al2O3:
    - 0.0
    - 0.15
    Na2O:
    - 0.0
    - 0.2
    K2O:
    - 0.0
    - 0.1
    CaO:
    - 0.0
    - 0.15
    MgO:
    - 0.0
    - 0.1
properties:
- name: forming_temperature
  predictor: glassnet
  output: T3
  unit: K
  representation: physical
  direction: min
  objective: mean
- name: thermal_expansion
  predictor: glassnet
  output: CTEbelowTg
  unit: K^-1
  representation: physical
  direction: min
  objective: mean
- name: glass_transition
  predictor: glassnet
  output: Tg
  unit: K
  representation: physical
  direction: max
  objective: mean
reward:
  type: gated
  objective:
    terms:
      forming_temperature: 1.0
  gates:
  - name: low_expansion
    score:
      terms:
        thermal_expansion: 1.0
    min: 0.0
    max: 4.9e-06
    penalty_weight: 1000000
  - name: sufficient_transition_temperature
    score:
      terms:
        glass_transition: 1.0
    min: 838.15
    penalty_weight: 0.001
  - name: forming_temperature_protocol_range
    score:
      terms:
        forming_temperature: 1.0
    min: 0.0
    max: 2000.0
    penalty_weight: 0.001
  failure:
    reward: -10.0
gamma: 1.0
train_count_duplicates: false
train_max_duplicate_attempts: 2000
num_gen_eps: 0
dqn_warmup_eps: 100
dqn_batch_size: 64
dqn_grad_steps_per_ep: 1
dqn_hidden_dim: 128
dqn_buffer_size: 20000
dqn_augment_permutations: 0
dqn_loss: smoothl1
dqn_lr: 0.0026762686165498857
train_budget: 10000
method: dqn
eval_seed: 0
train_seed: 11
gen_seed: 11
dqn_target_mode: mc
value_normalization: popart
gradient_clipping: clipping
exploration_target: 0.7
gen_exploration_target: 0.7
exploration_adaptive: true
