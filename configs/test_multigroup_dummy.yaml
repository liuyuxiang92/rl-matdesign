# Chemical amounts and categorical assignments; see docs/design_groups.md.
groups:
- name: P_site
  kind: composition
  species_set:
  - Mn
  - Ni
  - P
  amount_set:
  - 0.05
  - 0.1
  - 0.9
  - 0.95
  n_steps: 2
  total: 1
  unique: true
- name: S_site
  kind: composition
  species_set:
  - S
  - O
  - Cl
  amount_set:
  - 0.2
  - 0.3
  - 0.7
  - 0.8
  n_steps: 2
  total: 1
  unique: true
properties:
- name: quality
  predictor: dummy
  direction: max
  objective: mean
reward:
  type: weighted_sum
pg_warmup_eps: 20
pg_num_iters: 8
pg_batch_eps: 5
pg_lr_actor: 0.001
pg_lr_critic: 0.001
pg_entropy_coef: 0.01
gen_temperature: 1.0
gen_top_frac: 0.0
gen_epsilon: 0.0
gamma: 0.99
pg_repeat_penalty_coef: 0.1
pg_repeat_penalty_shape: log
num_gen_eps: 20
dqn_lr: 0.001
dqn_batch_size: 32
dqn_warmup_eps: 20
dqn_num_train_eps: 60
dqn_buffer_size: 1000
dqn_grad_steps_per_ep: 5
dqn_target_update_freq: 20
dqn_eps_anneal_eps: 40
dqn_eps_min: 0.05
